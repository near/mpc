# Static analysis of this repo's own workflow files: template injection,
# unpinned actions, over-broad permissions.
name: Workflow Security Analysis

on:
  pull_request:
  # A push to a branch with no open PR fires no `pull_request` event, so pushes
  # are covered separately rather than relying on PRs alone.
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No token scopes by default; each job opts into only what it needs.
permissions: {}

jobs:
  zizmor:
    name: "Audit workflows"
    # Skip a same-repo PR: the push to its branch already audited these commits.
    # Everything else runs, which leaves pushes and fork PRs, the latter having
    # no push event of their own.
    if: >-
      !(github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      security-events: write # zizmor uploads its own SARIF

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # Fork PRs cap security-events at read and so cannot upload; zizmor
          # then prints its findings and fails the job instead.
          advanced-security: ${{ github.event_name != 'pull_request' }}
