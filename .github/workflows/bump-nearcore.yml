name: Bump nearcore

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Nearcore tag (leave empty for latest release)'
        required: false

concurrency:
  group: bump-nearcore

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: warp-ubuntu-2604-x64-2x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Bump nearcore
        env:
          GH_TOKEN: ${{ github.token }}
          NEARCORE_TAG: ${{ inputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: .github/scripts/bump-nearcore.sh
