name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

jobs:
  lint-pr-title:
    name: "Check PR title format"
    runs-on: warp-ubuntu-2604-x64-2x
    permissions:
      contents: read
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
            build
            ci
            revert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-pr-title-type:
    name: "Validate title type matches changes"
    runs-on: warp-ubuntu-2604-x64-2x
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    outputs:
      comment: ${{ fromJSON(steps.check-title.outputs.structured_output).comment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build prompt with PR title and changed files
        id: build-prompt
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(gh pr diff "$PR_NUMBER" --name-only)
          DELIM="PROMPT_EOF_$(uuidgen)"
          {
            echo "TITLE_CHECK_PROMPT<<$DELIM"
            printf 'PR TITLE: %s\n' "$PR_TITLE"
            echo ""
            echo "CHANGED FILES:"
            echo "$FILES"
            echo ""
            cat .github/prompts/pr-title-check.prompt.md
            echo "$DELIM"
          } >> "$GITHUB_ENV"

      - name: Validate title type matches changes
        id: check-title
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API }}
          prompt: ${{ env.TITLE_CHECK_PROMPT }}
          # Deny is evaluated before allow, so these hold whatever tools are allowed.
          # `//` anchors at the filesystem root; a single `/` would anchor at the
          # settings source. Read rules also cover Grep and Glob.
          settings: |
            {
              "permissions": {
                "deny": [
                  "Read(//proc/**)",
                  "Read(//sys/**)",
                  "Read(//root/**)",
                  "Read(//home/runner/work/_temp/**)",
                  "Read(//home/runner/.claude/**)",
                  "Read(//home/runner/.config/**)",
                  "Read(//home/runner/.netrc)",
                  "Read(//home/runner/.git-credentials)",
                  "Bash(*ANTHROPIC_API_KEY*)",
                  "Bash(*GITHUB_TOKEN*)",
                  "Bash(*GH_TOKEN*)"
                ]
              }
            }
          claude_args: >-
            --model claude-haiku-4-5
            --json-schema '{"type":"object","properties":{"comment":{"type":"string","description":"The PR comment suggesting a title type, or the empty string when the type fits"}},"required":["comment"],"additionalProperties":false}'

  # Posting runs in its own job so the write-scoped token never reaches the
  # agent's environment, and so the runner withholds a comment that contains a
  # registered secret instead of passing it on.
  post-title-suggestion:
    name: "Post title type suggestion"
    needs: check-pr-title-type
    if: needs.check-pr-title-type.outputs.comment != ''
    runs-on: warp-ubuntu-2604-x64-2x
    permissions:
      pull-requests: write
    steps:
      - name: Post title type suggestion
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT: ${{ needs.check-pr-title-type.outputs.comment }}
        run: |
          printf '%s\n' "$COMMENT" > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
