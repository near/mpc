name: Nix build mpc-node

concurrency:
  # Hardcoded group name (not `${{ github.workflow }}`) because when invoked via
  # `workflow_call`, `github.workflow` resolves to the *caller's* workflow name,
  # which causes a concurrency-group collision with the caller and a deadlock.
  group: nix-build-mpc-node-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  workflow_call:

jobs:
  nix-build-mpc-node:
    name: "Nix build mpc-node"
    runs-on: warp-ubuntu-2604-x64-32x
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: sandbox-fallback = false

      - name: Restore /nix from cache
        uses: ./.github/actions/restore-nix-cache

      # nix.conf only warns on an unknown setting, so assert the values Nix applied
      - name: Check the Nix sandbox is enforced
        run: |
          nix config show sandbox | grep -x true
          nix config show sandbox-fallback | grep -x false

      - name: Build mpc-node image
        run: nix build --print-build-logs --no-update-lock-file --out-link result-mpc-node .#mpc-node-image

      - name: Build mpc-node-gcp image
        run: nix build --print-build-logs --no-update-lock-file --out-link result-mpc-node-gcp .#mpc-node-gcp-image

      - name: Build mpc-launcher image
        run: nix build --print-build-logs --no-update-lock-file --out-link result-mpc-launcher .#mpc-launcher-image

      - name: Print image digests
        run: sha256sum result-*/manifest.json

      - name: Check the images start
        run: |
          skopeo copy dir:result-mpc-node docker-daemon:mpc-node:latest
          skopeo copy dir:result-mpc-node-gcp docker-daemon:mpc-node-gcp:latest
          skopeo copy dir:result-mpc-launcher docker-daemon:mpc-rust-launcher:latest
          docker run --rm mpc-node /app/mpc-node --version | grep -F "(commit ${GITHUB_SHA::7})"
          docker run --rm mpc-node-gcp gcloud --version
          ./scripts/check-mpc-node-docker-starts.sh
          NODE_IMAGE_NAME=mpc-node-gcp ./scripts/check-mpc-node-docker-starts.sh
          ./scripts/check-mpc-node-docker-starts.sh --rust-launcher
