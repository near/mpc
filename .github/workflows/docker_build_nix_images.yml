name: Build and Publish Nix Docker Images

# Not cancelled by newer runs: an interrupted push can orphan blobs that break later pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
      - 'release/v*'
  workflow_dispatch:

permissions: {}

jobs:
  build-images:
    name: "Build Nix Docker images"
    runs-on: warp-ubuntu-2604-x64-16x
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: $/.github/actions/install-nix

      - name: Build mpc-node image
        run: nix build --print-build-logs --no-update-lock-file --out-link out/mpc-node .#mpc-node-image

      - name: Build mpc-launcher image
        run: nix build --print-build-logs --no-update-lock-file --out-link out/mpc-launcher .#mpc-launcher-image

      - name: Print image digests
        run: sha256sum out/*/manifest.json

      - name: Upload images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: out
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Separate from the build job, which has no secrets, so the registry
  # credentials never reach code that runs during the build
  push-images:
    name: "Push Nix Docker images with commit hash"
    needs: build-images
    runs-on: warp-ubuntu-2604-x64-2x
    environment: production
    permissions: {}

    steps:
      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: out

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Push images
        run: |
          tag="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}-nix"
          for image in mpc-node mpc-launcher; do
            skopeo copy --preserve-digests "dir:out/$image" "docker://docker.io/nearone/$image:$tag"
          done
