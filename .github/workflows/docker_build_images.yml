name: Build Docker Images

# cancel-in-progress is false to avoid orphaning blobs mid-push; see RELEASES.md.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
      - 'release/v*'
  workflow_dispatch:

jobs:
  build-and-push-images:
    name: "Build and push Docker images with commit hash"
    runs-on: warp-ubuntu-2604-x64-16x
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: sandbox-fallback = false

      - name: Build and push images
        run: |
          tag="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          for image in mpc-node mpc-node-gcp mpc-launcher; do
            nix build --print-build-logs --out-link "result-$image" ".#$image-image"
            sha256sum "result-$image/manifest.json"
            skopeo copy --preserve-digests "dir:result-$image" "docker://docker.io/nearone/$image:$tag"
          done
