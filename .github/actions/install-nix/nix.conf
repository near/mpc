# CI builds the images, and the tools that build the contract, with this Nix. Operators vote on the
# results, so the settings below limit a build's inputs to the pinned sources and the pre-built
# packages of the official cache. A build still sees Nix itself and parts of the runner, such as
# its kernel, CPU, core count and clock. The settings that match Nix's defaults are set too, so
# they don't depend on the Nix version, the user or the runner, and the install script fails unless
# Nix applies exactly these settings and its defaults for the rest

# Enable the nix command and flakes, which the builds use (default: none)
experimental-features = nix-command flakes
# Run every build in a sandbox that sees only its dependencies, its build folder, private system
# folders and a shell from Nix. A build whose output must match a hash fixed in advance, such as a
# download, also gets network access and the runner's DNS settings (default: the same)
sandbox = true
# Fail rather than silently build without a sandbox where the kernel refuses one (default: true)
sandbox-fallback = false
# Run builds as the unprivileged users the installer creates; the installer sets this too
# (default: the same for root, none for other users)
build-users-group = nixbld
# Download pre-built packages only from the official cache, and only if signed with its key or named
# by the hash of their content, which Nix verifies (default: the same)
substituters = https://cache.nixos.org/
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
require-sigs = true
# Trust only root: others can't change most daemon settings, enable other caches or add packages
# the rule above refuses (default: the same)
trusted-users = root
trusted-substituters =
# Turn off remote builds, so every build runs on this runner (default: Nix's own remote-build
# program and the machines file in Nix's config folder)
build-hook =
builders =
# Run no programs before or after builds, and load no plugins (default: the same)
pre-build-hook =
post-build-hook =
plugin-files =
# Give Nix expressions no builtins that run a program of their choice or load native code on the
# runner (default: the same)
allow-unsafe-native-code-during-evaluation = false
# Deny builds some risky system calls, such as chmod with setuid or setgid bits and setting extended
# attributes, and stop them from gaining privileges through setuid or file-capability programs
# (default: the same)
filter-syscalls = true
allow-new-privileges = false
# Fail a build rather than let it inherit Nix's supplementary groups when Nix can't drop them
# (default: the same for root, false for other users)
require-drop-supplementary-groups = true
# Build only packages that need no features beyond these, which keeps the KVM device out of builds
# (default: the same, plus kvm where Nix can open it)
system-features = benchmark big-parallel nixos-test uid-range
# Refuse to build from a checkout whose tracked files have uncommitted changes, as no commit would
# reproduce the result (default: true)
allow-dirty = false
# Trust the system's CA certificates for Nix's own downloads, and give them to builds that download;
# set here so the variables naming a CA file can't change it (default: the same file)
ssl-cert-file = /etc/ssl/certs/ca-certificates.crt
# Take download credentials from this netrc file, if it exists (default: the netrc file in Nix's
# config folder, so the same file)
netrc-file = /etc/nix/netrc
# Run up to one build per CPU at a time, so the builds use the whole runner (default: 1)
max-jobs = auto
