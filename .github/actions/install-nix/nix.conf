# Operators vote on the digests of the images built with this Nix, so a build must depend on
# nothing but the pinned sources, which these settings ensure. Settings that match Nix's defaults
# are set too, so a newer Nix can't change them. The install script fails unless Nix applies
# exactly these settings

# Enable the nix command and flakes, which the image builds use (default: none)
experimental-features = nix-command flakes
# Build every derivation in a sandbox that sees only its declared inputs (default: true)
sandbox = true
# Fail when the kernel doesn't allow the sandbox, instead of silently building without it (default: true)
sandbox-fallback = false
# Run builds as the unprivileged users the installer creates (default: none, so builds run as root)
build-users-group = nixbld
# Download pre-built packages only from the official cache, and only if signed with its key (default: the same)
substituters = https://cache.nixos.org/
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
require-sigs = true
# Let only root change these settings, and list no caches that other users may enable (default: the same)
trusted-users = root
trusted-substituters =
# Empty turns off remote builds, so every build runs on this runner (default: nix __build-remote)
build-hook =
# List no machines for remote builds (default: the machines file in Nix's config folder)
builders =
# Run no programs before or after builds, and load no plugins (default: none)
pre-build-hook =
post-build-hook =
plugin-files =
# Give Nix expressions no builtins that run programs or load native code on the runner (default: false)
allow-unsafe-native-code-during-evaluation = false
# Stop builds from creating setuid files or extended attributes, and from gaining privileges (default: the same)
filter-syscalls = true
allow-new-privileges = false
# Refuse to build from a checkout with uncommitted changes, as no commit would reproduce its images (default: true)
allow-dirty = false
# Trust the system's CA certificates for downloads, set here so an environment variable can't change it (default: the same file)
ssl-cert-file = /etc/ssl/certs/ca-certificates.crt
# Read download credentials only from this file (default: the same file)
netrc-file = /etc/nix/netrc
# Build up to one derivation per CPU in parallel (default: 1)
max-jobs = auto
