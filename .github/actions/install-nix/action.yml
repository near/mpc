name: Install Nix
description: |
  Install Nix from its official release tarball, checked against a pinned
  hash, and fail unless it applies exactly the settings in nix.conf. The
  Determinate Systems installer action is not used: by default it runs its
  installer as root without a pinned hash, installs Determinate Nix with a
  closed-source daemon, and trusts FlakeHub's cache and signing keys, which
  its extra-conf input can't remove. Its upstream Nix mode is unsupported and
  would need the same pinning and checks as this action.
runs:
  using: composite
  steps:
    - name: Install Nix
      shell: bash
      run: |
        "$GITHUB_ACTION_PATH/install.sh"
        echo /nix/var/nix/profiles/default/bin >> "$GITHUB_PATH"
