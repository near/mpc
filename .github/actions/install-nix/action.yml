name: Install Nix
description: |
  Install Nix from its official release tarball, checked against a pinned
  hash, and assert the settings the image builds rely on. Third-party
  installers are avoided because they are not pinned by hash and may trust
  extra binary caches and signing keys.
runs:
  using: composite
  steps:
    - name: Install Nix
      shell: bash
      env:
        NIX_VERSION: 2.35.2
        NIX_TARBALL_SHA256: 0c3960a9792331a22081c3c7a5d8465db9b17c50b3acdf18587fa4c6f2cb1158
      run: |
        release="nix-$NIX_VERSION-x86_64-linux"
        tarball="$RUNNER_TEMP/$release.tar.xz"
        curl -fsSL -o "$tarball" "https://releases.nixos.org/nix/nix-$NIX_VERSION/$release.tar.xz"
        echo "$NIX_TARBALL_SHA256  $tarball" | sha256sum -c
        tar -xJf "$tarball" -C "$RUNNER_TEMP"
        "$RUNNER_TEMP/$release/install" --daemon --yes --no-channel-add \
          --nix-extra-conf-file "$GITHUB_ACTION_PATH/nix.conf"
        echo /nix/var/nix/profiles/default/bin >> "$GITHUB_PATH"

    # Operators vote on the digests of the images built with this Nix, so a build must depend on
    # nothing but the pinned sources: it runs in an isolated sandbox, and pre-built packages come
    # only from the official cache (cache.nixos.org), signed with its key. Each line below reads
    # back one setting that could weaken this (an extra cache or key, a disabled sandbox, a user
    # other than root allowed to change settings, or a hook, plugin or remote machine taking part
    # in builds) and fails the job unless Nix applied the expected value. Nix only warns about a
    # misspelled setting in nix.conf, and the installer, environment variables or a newer Nix can
    # change a value, so the applied values are checked rather than the file
    - name: Check the Nix build settings
      shell: bash
      run: |
        nix config show sandbox | grep -x true
        nix config show sandbox-fallback | grep -x false
        nix config show require-sigs | grep -x true
        nix config show substituters | grep -xF https://cache.nixos.org/
        nix config show trusted-substituters | grep -x ''
        nix config show trusted-public-keys | grep -xF cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
        nix config show trusted-users | grep -x root
        nix config show sandbox-paths | grep -xE '/bin/sh=/nix/store/[^ ]+/bin/busybox'
        nix config show pre-build-hook | grep -x ''
        nix config show post-build-hook | grep -x ''
        nix config show build-hook | grep -x ''
        nix config show plugin-files | grep -x ''
        nix config show external-builders | grep -xF '[]'
        nix config show experimental-features | grep -xF 'fetch-tree flakes nix-command'
