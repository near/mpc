# The project's own cache of the pre-built tools the CI checks need, on Cachix, a binary cache
# service built for Nix that Nix reads natively. Nix accepts a package from it only with a valid
# signature from the key below. The builds operators vote on don't use it.
extra-substituters = https://near-mpc.cachix.org
# The public half of the cache's signing key. The private half goes in the repository's GitHub
# settings, as a secret of the environment that only main can use.
# TODO(#4664): set the key once the cache exists; until then Nix accepts nothing from the cache
extra-trusted-public-keys =
