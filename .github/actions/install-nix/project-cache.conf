# The project's own cache of the pre-built tools the CI checks need, on Cachix, a binary cache
# service built for Nix that Nix reads natively. Nix accepts a package from it only if a trusted
# key signed it, or if it is named by the hash of its content. The builds operators vote on don't
# use it. Cachix is the de facto standard hosted cache for Nix, but nothing ties the checks to it:
# any binary cache Nix reads works here, such as files in Nix's cache layout on an HTTPS host or in
# an S3-compatible bucket, and the key is ours, so moving means changing this URL and the push step.
extra-substituters = https://near-mpc.cachix.org
# The public half of the cache's signing key. The private half goes in the repository's GitHub
# settings, as a secret of the environment that only main and release branches can use
extra-trusted-public-keys = near-mpc.cachix.org-1:OISc3ZUsqXbQMjxgPFRs9C5D9gS1ougsLC83acFL7qE=
# Build a package from source when a cache errors while serving it, so trouble at a cache slows
# the checks down instead of failing them.
fallback = true
