# The project's own cache of the pre-built tools the CI checks need. Only one job on main pushes
# to it, signing with a key that no other branch can read, and Nix accepts a package from it only
# with a valid signature. The builds operators vote on don't use it (default: none)
extra-substituters = https://near-mpc.cachix.org
extra-trusted-public-keys = near-mpc.cachix.org-1:V+j/TX1A+L+bEPQDMJDaSvHmBLdd52azm05iY912aK8=
