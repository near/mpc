[package]
name = "near-contract-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NEAR function-call payload and the CallContract/ViewContract transport traits shared across the MPC stack"

[features]
traits = [
    "dep:near-account-id",
    "dep:borsh",
    "dep:thiserror",
    "dep:serde_json",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
]
