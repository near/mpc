[package]
name = "near-contract-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NEAR function-call payload and the CallContract/ViewContract transport traits shared across the MPC stack"

[features]
# The payload types build without this; the transport traits and the polling
# machinery behind them need a tokio runtime, which a wasm contract cannot have.
traits = [
    "dep:near-account-id",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
]
# A programmable `ViewContract` double, so each crate does not grow its own.
test-utils = ["traits"]

[dependencies]
borsh = { workspace = true }
derive_more = { workspace = true }
near-account-id = { workspace = true, optional = true }
near-gas = { workspace = true }
near-token = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[dev-dependencies]
assert_matches = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
