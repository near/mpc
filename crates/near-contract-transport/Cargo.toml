[package]
name = "near-contract-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NEAR function-call payload and the CallContract/ViewContract transport traits shared across the MPC stack"

[features]
traits = ["dep:near-account-id"]
monitoring = ["traits", "dep:thiserror", "dep:tokio", "dep:tokio-util", "dep:tracing"]

[dependencies]
borsh = { workspace = true }
derive_more = { workspace = true }
near-account-id = { workspace = true, optional = true }
near-gas = { workspace = true }
near-token = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[lints]
workspace = true
