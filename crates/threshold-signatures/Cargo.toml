[package]
name = "threshold-signatures"
description = "Threshold Signatures"
repository = "https://github.com/near/threshold-signatures"
version = "0.1.0"
edition = { workspace = true }
license.workspace = true

[lib]
bench = false

[features]
test-utils = ["rand", "rand_chacha"]

[dependencies]
blstrs.workspace = true
borsh.workspace = true
derive_more = { workspace = true, features = ["deref_mut"] }
digest.workspace = true
ecdsa.workspace = true
elliptic-curve.workspace = true
frost-core.workspace = true
frost-ed25519.workspace = true
frost-secp256k1.workspace = true
futures.workspace = true
hex.workspace = true
itertools.workspace = true
k256 = { workspace = true, default-features = true, features = [
    "sha256",
    "ecdsa",
    "serde",
    "hash2curve",
] }
keccak.workspace = true
pairing.workspace = true
rand = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }
rand_core.workspace = true
reddsa.workspace = true
rmp-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
sha2.workspace = true
sha3.workspace = true
subtle.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
average.workspace = true
criterion.workspace = true
hkdf.workspace = true
insta.workspace = true
rand.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
rstest.workspace = true
threshold-signatures = { path = ".", features = ["test-utils"] }
wycheproof.workspace = true

[[bench]]
name = "lagrange"
harness = false

[[bench]]
name = "inversion"
harness = false

[[bench]]
name = "naive_robust_ecdsa"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "naive_ot_based_ecdsa"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "advanced_robust_ecdsa"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "advanced_ot_based_ecdsa"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "advanced_eddsa_frost_sign_v1"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "advanced_eddsa_frost_sign_v2"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "ckd"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "advanced_dkg"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "simulate_dkg"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "simulate_frost"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "simulate_ecdsa"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "simulate_ckd"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "simulate_triples"
harness = false
required-features = ["test-utils"]

[lints.clippy]
mod_module_files = "deny"
# We might revisit these exceptions in the future
missing_const_for_fn = "allow"
trait_duplication_in_bounds = "allow"
missing_errors_doc = "allow"
similar_names = "allow"
many_single_char_names = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"

# TODO(#5198): remove once on Rust 1.101. Clippy 1.99 and 1.100 flag
# `derive_more::Constructor` output as redundant field names
# (rust-lang/rust-clippy#17525).
redundant_field_names = "allow"

# Part of clippy restriction group
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "warn"
unwrap_used = "warn"

# Lint groups used
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# This crate opts out of `[lints] workspace = true`, so the workspace-level
# rustdoc deny does not apply here and must be repeated
[lints.rustdoc]
broken_intra_doc_links = "deny"
