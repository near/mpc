[package]
name = "near-mpc-sdk"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SDK for requesting, verifying threshold signatures from the NEAR MPC network and validation shared between the contract and its clients."

# Never referenced by name: the unit-testing feature provides the mocked ecrecover
# host functions that near-mpc-signature-verifier needs in native test builds.
[package.metadata.cargo-shear]
ignored = ["near-sdk"]

[features]
abi = [
    "near-mpc-contract-interface/abi",
    "near-mpc-signature-verifier/abi",
    "near-mpc-bounded-collections/abi",
    "borsh/unstable__schema",
]

[dependencies]
borsh = { workspace = true }
derive_more = { workspace = true }
near-mpc-bounded-collections = { workspace = true }
near-mpc-contract-interface = { workspace = true }
near-mpc-signature-verifier = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
assert_matches = { workspace = true }
k256 = { workspace = true }
near-mpc-contract-interface = { workspace = true, features = ["k256"] }
near-sdk = { workspace = true, features = ["unit-testing"] }

[lints]
workspace = true
