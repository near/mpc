# Testnet RPC provider whitelist: HyperEVM, Polygon, Avalanche, Fogo (vote of 2026-09-28).
# Delta only; chains apply independently. Full state lives in testnet-rpc-whitelist.toml.

[chains.HyperEvm]
quorum = 3

[chains.HyperEvm.providers.chainstack]
base_url = "https://hyperliquid-testnet.core.chainstack.com/"
auth_scheme = { Path = { placeholder = "{API_KEY}" } }
chain_routing = "Embedded"

[chains.HyperEvm.providers.public]
base_url = "https://rpc.hyperliquid-testnet.xyz/evm"
auth_scheme = "None"
chain_routing = "Embedded"

[chains.HyperEvm.providers.quicknode]
base_url = "https://{}.hype-testnet.quiknode.pro"
auth_scheme = { Path = { placeholder = "{api_key}" } }
chain_routing = "Embedded"

[chains.Polygon]
quorum = 3

[chains.Polygon.providers.alchemy]
base_url = "https://polygon-amoy.g.alchemy.com/v2/"
auth_scheme = { Path = { placeholder = "{API_KEY}" } }
chain_routing = "Embedded"

[chains.Polygon.providers.quicknode]
base_url = "https://{}.matic-amoy.quiknode.pro"
auth_scheme = { Path = { placeholder = "{api_key}" } }
chain_routing = "Embedded"

[chains.Polygon.providers.tatum]
base_url = "https://polygon-amoy.gateway.tatum.io"
auth_scheme = { Header = { name = "x-api-key" } }
chain_routing = "Embedded"

[chains.Avalanche]
quorum = 3

[chains.Avalanche.providers.public]
base_url = "https://api.avax-test.network/ext/bc/C/rpc"
auth_scheme = "None"
chain_routing = "Embedded"

[chains.Avalanche.providers.quicknode]
base_url = "https://{}.avalanche-testnet.quiknode.pro"
auth_scheme = { Path = { placeholder = "{api_key}" } }
chain_routing = "Embedded"

[chains.Avalanche.providers.tatum]
base_url = "https://avax-testnet.gateway.tatum.io"
auth_scheme = { Header = { name = "x-api-key" } }
chain_routing = "Embedded"

[chains.Fogo]
quorum = 1

[chains.Fogo.providers.public]
base_url = "https://testnet.fogo.io"
auth_scheme = "None"
chain_routing = "Embedded"

# Arbitrum re-vote: Tatum host changes to arbitrum-one-sepolia.
[chains.Arbitrum]
quorum = 3

[chains.Arbitrum.providers.alchemy]
base_url = "https://arb-sepolia.g.alchemy.com/v2/"
auth_scheme = { Path = { placeholder = "{API_KEY}" } }
chain_routing = "Embedded"

[chains.Arbitrum.providers.quicknode]
base_url = "https://{}.arbitrum-sepolia.quiknode.pro"
auth_scheme = { Path = { placeholder = "{api_key}" } }
chain_routing = "Embedded"

[chains.Arbitrum.providers.tatum]
base_url = "https://arbitrum-one-sepolia.gateway.tatum.io"
auth_scheme = { Header = { name = "x-api-key" } }
chain_routing = "Embedded"
