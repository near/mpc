# Mainnet RPC provider whitelist

[chains.Bitcoin]
quorum = 1

[chains.Bitcoin.providers.public]
base_url = "https://bitcoin-rpc.publicnode.com"
auth_scheme = "None"
chain_routing = "Embedded"

[chains.Abstract]
quorum = 3

[chains.Abstract.providers.alchemy]
base_url = "https://abstract-mainnet.g.alchemy.com/v2/"
auth_scheme = { Path = { placeholder = "{API_KEY}" } }
chain_routing = "Embedded"

[chains.Abstract.providers.abstract-mainnet]
base_url = "https://api.mainnet.abs.xyz"
auth_scheme = "None"
chain_routing = "Embedded"

[chains.Abstract.providers.quicknode]
base_url = "https://{}.abstract-mainnet.quiknode.pro"
auth_scheme = { Path = { placeholder = "{api_key}" } }
chain_routing = "Embedded"

