# Mainnet RPC provider whitelist: Solana, BNB, Base, Arbitrum, Polygon, Avalanche, HyperEVM, Fogo (vote of 2026-10-08).
# Delta only; chains apply independently. Full state lives in mainnet-rpc-whitelist.toml.

[chains.Solana]
quorum = 3

[chains.Solana.providers.alchemy]
base_url = "https://solana-mainnet.g.alchemy.com/v2/"
auth_scheme = { Path = { placeholder = "{API_KEY}" } }
chain_routing = "Embedded"

[chains.Solana.providers.public]
base_url = "https://api.mainnet-beta.solana.com"
auth_scheme = "None"
chain_routing = "Embedded"

[chains.Solana.providers.quicknode]
base_url = "https://{}.solana-mainnet.quiknode.pro"
auth_scheme = { Path = { placeholder = "{api_key}" } }
chain_routing = "Embedded"

[chains.Solana.providers.tatum]
base_url = "https://solana-mainnet.gateway.tatum.io"
auth_scheme = { Header = { name = "x-api-key" } }
chain_routing = "Embedded"

