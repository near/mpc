[package]
name = "borsch-args-cli"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "Decodes borsh-encoded contract call arguments into reviewable JSON."

[[bin]]
name = "borsh-args-cli"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
borsh = { workspace = true }
clap = { workspace = true }
dcap-qvl = {workspace = true}
hex = { workspace = true }
near-mpc-bounded-collections = { workspace = true }
near-mpc-contract-interface = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tee-verifier-interface = { workspace = true, features = ["serde"] }

[lints]
workspace = true