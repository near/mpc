# Foreign chain RPC config embedded in the node for mainnet, covered by the image hash vote.
# A provider is enabled by the operator's `foreign_chains.credentials.<provider>` entry, whose API
# key replaces the empty `token` below and whose slug replaces `{slug}` in `rpc_url`. Providers with
# `auth.kind = "none"` are always enabled. Keep in sync with the network's provider whitelist.

[bitcoin]
timeout_sec = 30
max_retries = 3
expected_network_fingerprint = "000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b60a8ce26f"  # genesis block hash

[bitcoin.providers.public]
rpc_url = "https://bitcoin-rpc.publicnode.com"

[abstract]
timeout_sec = 30
max_retries = 3
expected_network_fingerprint = "2741"

[abstract.providers.abstract-mainnet]
rpc_url = "https://api.mainnet.abs.xyz"

[abstract.providers.alchemy]
rpc_url = "https://abstract-mainnet.g.alchemy.com/v2/{api_key}"
auth = { kind = "path", placeholder = "{api_key}", token = { val = "" } }

[abstract.providers.quicknode]
rpc_url = "https://{slug}.abstract-mainnet.quiknode.pro/{api_key}"
auth = { kind = "path", placeholder = "{api_key}", token = { val = "" } }

