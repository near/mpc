# Foreign chain RPC config embedded in the node for testnet, covered by the image hash vote.
# A provider is enabled by the operator's `foreign_chains.credentials.<provider>` entry, whose API
# key replaces the empty `token` below and whose slug replaces `{slug}` in `rpc_url`. Providers with
# `auth.kind = "none"` are always enabled. Keep in sync with the network's provider whitelist.

[bitcoin]
timeout_sec = 30
max_retries = 3
expected_network_fingerprint = "000000000933ea01ad0ee984209779baaec3ced90fa3f408719526f8d77f4943"  # genesis block hash

[bitcoin.providers.public]
rpc_url = "https://bitcoin-testnet-rpc.publicnode.com"

[abstract]
timeout_sec = 30
max_retries = 3
expected_network_fingerprint = "11124"

[abstract.providers.abstract-testnet]
rpc_url = "https://api.testnet.abs.xyz"

[abstract.providers.alchemy]
rpc_url = "https://abstract-testnet.g.alchemy.com/v2/{API_KEY}"
auth = { kind = "path", placeholder = "{API_KEY}", token = { val = "" } }

[abstract.providers.quicknode]
rpc_url = "https://{slug}.abstract-testnet.quiknode.pro/{api_key}"
auth = { kind = "path", placeholder = "{api_key}", token = { val = "" } }

[starknet]
timeout_sec = 30
max_retries = 3
