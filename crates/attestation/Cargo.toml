[package]
name = "attestation"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[features]
borsh-schema = ["borsh/unstable__schema", "tee-verifier-interface/borsh-schema"]
dstack-conversions = ["dep:dstack-sdk-types"]
test-utils = []
# Accepts an app-compose carrying a `pre_launch_script`, which production rejects. Tests need it to
# verify the committed fixture, whose measured app-compose carries the hook that exported the signer
# key in `crates/test-utils/assets/near_account_secret_key`. Never implied by another feature, so
# every enablement stays explicit and must stay on dependency edges that only tests build.
allow-pre-launch-script = []
# Pulls in `dcap-qvl` for full local DCAP + post-DCAP verification. Off-chain callers only: the
# node, the attestation CLI and the TEE authority. The contract verifies through the verifier
# contract instead.
local-verify = ["dep:dcap-qvl", "dep:tee-verifier-conversions"]

[dependencies]
borsh = { workspace = true }
dcap-qvl = { workspace = true, optional = true }
derive_more = { workspace = true }
dstack-sdk-types = { workspace = true, optional = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
sha2 = { workspace = true }
tee-verifier-conversions = { workspace = true, optional = true }
tee-verifier-interface = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }

[dev-dependencies]
assert_matches = { workspace = true }
attestation = { path = ".", features = [
    "local-verify",
    "test-utils",
    "dstack-conversions",
] }
dstack-sdk-types = { workspace = true }
rstest = { workspace = true }
test-utils = { workspace = true }

[[test]]
name = "app_compose"
required-features = ["dstack-conversions"]

[[test]]
name = "collateral"
required-features = ["test-utils"]

[lints]
workspace = true
