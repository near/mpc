home_dir = "$HOME/.near/$MPC_NODE_ID"

[near_init]
chain_id = "mpc-localnet"
download_genesis = false
boot_nodes = "$NEAR_BOOT_NODES"
genesis_path = "$HOME/.near/mpc-localnet/genesis.json"
rpc_addr = "0.0.0.0:$RPC_PORT"
network_addr = "0.0.0.0:$INDEXER_PORT"

[secrets]
secret_store_key_hex = "11111111111111111111111111111111"

[tee]
image_hash = "sha256:8b40f81f77b8c22d6c777a6e14d307a1d11cb55ab83541fbb8575d02d86a74b0"
latest_allowed_hash_file_path = "/tmp/LATEST_ALLOWED_HASH_FILE.txt"

[tee.authority]
type = "local"

[log]
format = "plain"
filter = "info"

[node]
my_near_account_id = "$NEAR_ACCOUNT_ID"
near_responder_account_id = "$NEAR_ACCOUNT_ID"
number_of_responder_keys = 1
web_ui = "127.0.0.1:$WEB_UI_PORT"
migration_web_ui = "127.0.0.1:$MIGRATION_WEB_UI_PORT"
pprof_bind_address = "127.0.0.1:$PPROF_PORT"
cores = 4

[node.triple]
concurrency = 2
desired_triples_to_buffer = 128
timeout_sec = 120
parallel_triple_generation_stagger_time_sec = 1

[node.presignature]
concurrency = 4
desired_presignatures_to_buffer = 64
timeout_sec = 60

[node.signature]
timeout_sec = 60

[node.indexer]
validate_genesis = false
sync_mode = "Latest"
concurrency = 1
mpc_contract_id = "mpc-contract.test.near"
finality = "optimistic"

[node.ckd]
timeout_sec = 60

[node.foreign_chains.bitcoin]
timeout_sec = 30
max_retries = 3
# Genesis block hash, as block explorers render it. Distinguishes mainnet from
# testnet3 ("000000000933ea01ad0ee984209779baaec3ced90fa3f408719526f8d77f4943")
# and regtest ("0f9188f13cb7b2c71f2a335e3a4fc328bf5beb436012afca590b1a11466e2206").
expected_chain_identity = "000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b60a8ce26f"

[node.foreign_chains.bitcoin.providers.public]
rpc_url = "https://bitcoin-rpc.publicnode.com"

[node.foreign_chains.bitcoin.providers.public.auth]
kind = "none"

[node.foreign_chains.abstract]
timeout_sec = 30
max_retries = 3
expected_chain_identity = "2741"  # Abstract mainnet; testnet: "11124"

[node.foreign_chains.abstract.providers.public]
rpc_url = "https://api.mainnet.abs.xyz"

[node.foreign_chains.abstract.providers.public.auth]
kind = "none"

[node.foreign_chains.starknet]
timeout_sec = 30
max_retries = 3
expected_chain_identity = "0x534e5f4d41494e"  # SN_MAIN; Sepolia: "0x534e5f5345504f4c4941"

[node.foreign_chains.starknet.providers.public]
rpc_url = "https://starknet-rpc.publicnode.com"

[node.foreign_chains.starknet.providers.public.auth]
kind = "none"

[node.foreign_chains.aptos]
timeout_sec = 30
max_retries = 3
expected_chain_identity = "1"  # mainnet; testnet: "2"

[node.foreign_chains.aptos.providers.public]
rpc_url = "https://fullnode.mainnet.aptoslabs.com/v1"

[node.foreign_chains.aptos.providers.public.auth]
kind = "none"

[node.foreign_chains.sui]
timeout_sec = 30
max_retries = 3
# Genesis checkpoint digest. Testnet: "69WiPg3DAQiwdxfncX6wYQ2siKwAe6L9BZthQea3JNMD".
expected_chain_identity = "4btiuiMPvEENsttpZC7CZ53DruC3MAgfznDbASZ7DR6S"

[node.foreign_chains.sui.providers.public]
rpc_url = "https://archive.mainnet.sui.io"

[node.foreign_chains.sui.providers.public.auth]
kind = "none"
