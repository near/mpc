<!doctype html>
<html><head><meta charset="utf-8"><title>DKG explainer</title>
<style>
  html,body{margin:0;padding:0;background:#0a0f1e;}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;
    background:radial-gradient(ellipse at 50% 35%, #142042 0%, #0a0f1e 70%);
    font-family:"DejaVu Sans","Liberation Sans",sans-serif;color:#e8edf8;}
  svg{position:absolute;left:0;top:0;}
  #cap{position:absolute;left:160px;right:160px;bottom:36px;text-align:center;font-size:31px;line-height:1.38;
    color:#f3f6fc;text-shadow:0 2px 6px #000a;}
  #cap span{background:rgba(6,10,22,.72);padding:6px 16px;border-radius:10px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
  #hdr{position:absolute;left:56px;top:38px;font-size:24px;letter-spacing:.06em;color:#8fa3cc;text-transform:uppercase;}
  #hdr b{color:#ffc542;font-weight:700;margin-right:14px}
  #bar{position:absolute;left:0;bottom:0;height:5px;background:linear-gradient(90deg,#4f8cff,#c58bff);}
</style></head>
<body>
<div id="stage"><svg id="svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<div id="hdr"></div><div id="cap"></div><div id="bar"></div></div>
<script>
const TL = window.TIMELINE;
const COL = ["#4f8cff","#ff7a59","#36c98a","#c58bff","#ffc542"];
const GOLD="#ffc542", RED="#ff5470", GREEN="#36c98a", DIM="#5b6b8f", INK="#e8edf8", PANEL="#16213f", LINE="#2b3a63";
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const lerp=(a,b,p)=>a+(b-a)*p;

// math markup: a_i, a_{ij}, x^m, x^{m}
function m(s){
  s=s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return s.replace(/([_^])(\{([^}]*)\}|(.))/g,(_,k,__,g,c)=>{
    const t=g!==undefined?g:c;
    return k==="_"?`<tspan dy="0.28em" font-size="72%">${t}</tspan><tspan dy="-0.28em">​</tspan>`
                  :`<tspan dy="-0.45em" font-size="68%">${t}</tspan><tspan dy="0.45em">​</tspan>`;
  });
}
function T(x,y,s,o={}){
  const sz=o.size||32, fill=o.fill||INK, anc=o.anchor||"middle", w=o.weight||"normal", op=o.op??1;
  const fam=o.mono?'"DejaVu Sans Mono",monospace':(o.serif?'"DejaVu Serif",serif':'inherit');
  const st=o.italic?'font-style="italic"':"";
  return `<text x="${x}" y="${y}" font-size="${sz}" fill="${fill}" text-anchor="${anc}" font-weight="${w}" opacity="${op}" font-family='${fam}' ${st} dominant-baseline="middle">${o.raw?s:m(s)}</text>`;
}
function g(op,inner,tr=""){ if(op<=0.001) return ""; return `<g opacity="${op}" ${tr?`transform="${tr}"`:""}>${inner}</g>`; }
function rect(x,y,w,h,o={}){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx??14}" fill="${o.fill||PANEL}" stroke="${o.stroke||LINE}" stroke-width="${o.sw||2}" ${o.dash?`stroke-dasharray="${o.dash}"`:""} opacity="${o.op??1}"/>`;}
function circ(x,y,r,o={}){return `<circle cx="${x}" cy="${y}" r="${r}" fill="${o.fill||"none"}" stroke="${o.stroke||"none"}" stroke-width="${o.sw||3}" ${o.dash?`stroke-dasharray="${o.dash}"`:""} opacity="${o.op??1}"/>`;}
function line(x1,y1,x2,y2,o={}){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.stroke||LINE}" stroke-width="${o.sw||3}" ${o.dash?`stroke-dasharray="${o.dash}"`:""} opacity="${o.op??1}" stroke-linecap="round"/>`;}
function arrow(x1,y1,x2,y2,p=1,o={}){
  if(p<=0) return "";
  const c=o.stroke||INK, sw=o.sw||4;
  const ex=lerp(x1,x2,p), ey=lerp(y1,y2,p);
  const a=Math.atan2(y2-y1,x2-x1), h=o.head||16;
  const hx1=ex-h*Math.cos(a-0.45), hy1=ey-h*Math.sin(a-0.45), hx2=ex-h*Math.cos(a+0.45), hy2=ey-h*Math.sin(a+0.45);
  return `<g opacity="${o.op??1}"><line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" ${o.dash?`stroke-dasharray="${o.dash}"`:""}/>`+
    `<path d="M${hx1},${hy1} L${ex},${ey} L${hx2},${hy2}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/></g>`;
}
function node(x,y,i,o={}){
  const r=o.r||46, c=o.color||COL[i%5];
  return `<g opacity="${o.op??1}">${circ(x,y,r+8,{fill:c,op:.13})}${circ(x,y,r,{fill:"#0f1730",stroke:c,sw:4})}`+
    T(x,y+1,o.label??`P_${i+1}`,{size:o.fs||30,fill:c,weight:"bold"})+`</g>`;
}
function keyIcon(x,y,s,c){
  return `<g transform="translate(${x},${y}) scale(${s})"><circle cx="-38" cy="0" r="26" fill="none" stroke="${c}" stroke-width="10"/>`+
   `<path d="M-12,0 H52 M30,0 V20 M46,0 V16" stroke="${c}" stroke-width="10" stroke-linecap="round" fill="none"/></g>`;
}
function lockIcon(x,y,s,c){
  return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-26" y="-6" width="52" height="40" rx="7" fill="${c}"/>`+
   `<path d="M-16,-6 V-20 A16,16 0 0 1 16,-20 V-6" fill="none" stroke="${c}" stroke-width="8"/></g>`;
}
function check(x,y,s,c=GREEN,p=1){ if(p<=0)return ""; const L=60*s;
  return `<path d="M${x-22*s},${y} L${x-6*s},${y+16*s} L${x+24*s},${y-18*s}" fill="none" stroke="${c}" stroke-width="${7*s}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-p)}"/>`;}
function cross(x,y,s,c=RED,op=1){return `<g opacity="${op}"><path d="M${x-18*s},${y-18*s} L${x+18*s},${y+18*s} M${x+18*s},${y-18*s} L${x-18*s},${y+18*s}" stroke="${c}" stroke-width="${7*s}" stroke-linecap="round"/></g>`;}
function chip(x,y,w,h,txt,c,o={}){
  return `<g opacity="${o.op??1}">${rect(x-w/2,y-h/2,w,h,{fill:o.fill||"#0f1730",stroke:c,sw:o.sw||3,rx:o.rx??h/2,dash:o.dash})}${T(x,y+1,txt,{size:o.size||26,fill:o.tc||c,weight:o.weight||"bold",mono:o.mono,raw:o.raw})}</g>`;
}
function badge(x,y,txt,c,op=1){const w=txt.length*13+40; return chip(x,y,w,38,txt,c,{size:20,op,fill:c+"22"});}
function packet(x1,y1,x2,y2,p,c,r=8){ if(p<=0||p>=1) return ""; return circ(lerp(x1,x2,p),lerp(y1,y2,p),r,{fill:c}); }
function pulse(t,per=1.6){return .5+.5*Math.sin(t*2*Math.PI/per);}

// ---------- scenes ----------
const S=[];
// 0 title
S.push(c=>{
  let o="";
  const pts=[[960,150],[1740,260],[1600,800],[320,800],[180,260]];
  for(let a=0;a<5;a++)for(let b=a+1;b<5;b++){ o+=line(...pts[a],...pts[b],{stroke:"#3a4f86",sw:2,op:.35*c.rv(0,0,1.2)});
    const ph=((c.T*0.35+a*0.17+b*0.29)%1); o+=g(.55*c.rv(0,0,1.2),packet(...pts[a],...pts[b],ph,COL[a],5)); }
  pts.forEach((p,k)=>o+=node(p[0],p[1],k,{op:.9*c.rv(0,k*.15)}));
  const p0=ease(c.rv(0,0.2,1));
  o+=g(p0,T(960,400,"Distributed Key Generation",{size:92,weight:"bold"}),`translate(0,${(1-p0)*30})`);
  o+=g(ease(c.rv(0,.7,1)),T(960,490,"How near/mpc creates a key that nobody holds",{size:40,fill:"#a9b8d9"}));
  o+=g(ease(c.rv(0,1.2,1)),T(960,560,"PedPop+  ·  crates/threshold-signatures",{size:28,fill:GOLD,mono:true}));
  // key splitting into fragments
  const k1=c.rv(1,0.2,.8), k2=ease(c.rv(1,1.6,2.2));
  if(k1>0){
    o+=g(k1*(1-k2*.9),keyIcon(960,700,1.4,GOLD));
    pts.forEach((p,k)=>{ if(k2>0){ const x=lerp(960,p[0],k2), y=lerp(700,p[1],k2);
      o+=g(k2,chip(x,y+ (k2>.98?72:0),110,40,`sk_${k+1}`,COL[k],{size:22}));}});
  }
  return o;
});
// 1 problem
S.push(c=>{
  let o="";
  const up=ease(c.rv(2,0,1.0));
  const yb=lerp(420,250,up), sc=lerp(1,.78,up);
  const pA=ease(c.rv(0,.3)), pB=ease(c.rv(0,.9));
  // pk card
  o+=g(pA,`<g transform="translate(600,${yb}) scale(${sc})">${rect(-260,-130,520,260,{fill:"#10233a",stroke:GREEN,sw:4,rx:24})}${keyIcon(-150,0,1.1,GREEN)}`+
     T(60,-35,"Public key",{size:40,fill:GREEN,weight:"bold"})+T(60,25,"pk",{size:44,serif:true,italic:true})+
     g(ease(c.rv(1,.2)),T(0,95,"known to everyone",{size:28,fill:"#a9d9c2"}))+`</g>`);
  const strike=ease(c.rv(1,2.6,1));
  o+=g(pB,`<g transform="translate(1320,${yb}) scale(${sc})">${rect(-260,-130,520,260,{fill:strike>0?"#1a1424":"#2a1626",stroke:RED,sw:4,rx:24,dash:strike>.5?"14 10":null})}`+
     g(1-0.6*strike,keyIcon(-150,0,1.1,RED))+
     T(60,-35,"Private key",{size:40,fill:RED,weight:"bold"})+T(60,25,"sk",{size:44,serif:true,italic:true})+
     g(strike,`<line x1="-220" y1="80" x2="220" y2="-80" stroke="${RED}" stroke-width="8" stroke-linecap="round" opacity=".85"/>`+T(0,100,"never assembled anywhere",{size:28,fill:"#ff9fb0"}))+`</g>`);
  // shares
  const N=5, xs=[...Array(N)].map((_,i)=>460+i*250), y=640;
  const hl3=ease(c.rv(2,2.8)), hl2=ease(c.rv(2,c.d(2)*0.62));
  xs.forEach((x,i)=>{
    const p=ease(c.rv(2,.6+i*.15));
    const on3=[0,2,3].includes(i)?hl3*(1-hl2):0, on2=[1,4].includes(i)?hl2:0;
    o+=g(p,node(x,y,i,{op:1-0.55*(hl3*(1-hl2)>0&&!on3?1:0)-0.55*(hl2>0&&!on2?hl2:0)})+chip(x,y+90,110,42,`sk_${i+1}`,COL[i],{size:24}));
    if(on3>0) o+=circ(x,y,66,{stroke:GOLD,sw:5,op:on3});
    if(on2>0) o+=circ(x,y,66,{stroke:RED,sw:5,op:on2,dash:"10 8"});
  });
  o+=g(ease(c.rv(2,1.6)),T(960,830,"N = 5 nodes   ·   threshold t = 3",{size:34,fill:"#a9b8d9",serif:true,italic:true}));
  o+=g(hl3*(1-hl2),T(960,890,"any t shares  →  can sign together",{size:32,fill:GOLD}));
  o+=g(hl2,T(960,890,"t − 1 shares  →  learn nothing about sk",{size:32,fill:"#ff9fb0"}));
  return o;
});
// 2 shamir
const F=x=>2.2+1.9*x-0.42*x*x;
S.push(c=>{
  let o="", dl="";
  const X0=330, Y0=800, UX=230, UY=105;
  const P=(x,y)=>[X0+x*UX, Y0-y*UY];
  const pAx=ease(c.rv(0,0,.8));
  o+=g(pAx,arrow(X0-40,Y0,X0+5.6*UX,Y0,1,{stroke:"#6b7cab",sw:3})+arrow(X0,Y0+30,X0,Y0-5.8*UY,1,{stroke:"#6b7cab",sw:3})+
     T(X0+5.6*UX+28,Y0,"x",{size:30,fill:"#8fa3cc",serif:true,italic:true})+
     [1,2,3,4,5].map(k=>line(X0+k*UX,Y0-8,X0+k*UX,Y0+8,{stroke:"#6b7cab"})+T(X0+k*UX,Y0+34,String(k),{size:24,fill:"#8fa3cc"})).join("")+T(X0,Y0+34,"0",{size:24,fill:"#8fa3cc"}));
  const altP=ease(c.rv(2,c.d(2)*0.5));
  const curveP=ease(c.rv(0,.6,2.2));
  const curveOp=1-0.75*altP;
  if(curveP>0){ let d=""; const xe=lerp(-0.05,5.3,curveP); for(let x=-0.05;x<=xe+1e-9;x+=0.05){const [px,py]=P(x,F(x)); d+=(d?"L":"M")+px.toFixed(1)+","+py.toFixed(1);}
    o+=`<path d="${d}" fill="none" stroke="${INK}" stroke-width="5" opacity="${curveOp}"/>`; }
  o+=g(ease(c.rv(0,1.6)),`<g>${rect(1150,120,640,70,{fill:"#0f1730"})}${T(1470,156,"f(x) = a_0 + a_1x + a_2x^2",{size:32,serif:true,italic:true})}</g>`+T(1470,225,"degree t − 1 = 2",{size:26,fill:"#8fa3cc"}));
  // secret & shares
  const pS=ease(c.rv(1,.3)); const [sx,sy]=P(0,F(0));
  const hl=ease(c.rv(2,.4))*(1-altP);
  o+=g(pS*(1-0.6*altP),circ(sx,sy,16,{fill:GOLD})+circ(sx,sy,28,{stroke:GOLD,sw:3,op:.6})+T(sx+40,sy-36,"secret = f(0)",{size:30,fill:GOLD,anchor:"start",weight:"bold"}));
  [1,2,3,4,5].forEach((k,i)=>{ const [px,py]=P(k,F(k)); const p=ease(c.rv(1,1.6+i*.25));
    const chosen=[2,3,5].includes(k), kept2=[1,4].includes(k);
    const op=p*(altP>0? (kept2?1:1-0.8*altP) : (hl>0&&!chosen?1-0.6*hl:1));
    o+=g(op,circ(px,py,13,{fill:COL[i]})+line(px,py+16,px,Y0,{stroke:COL[i],sw:2,dash:"6 6",op:.6})+T(px,py-36,`sk_${k} = f(${k})`,{size:24,fill:COL[i],weight:"bold"}));
    if(chosen&&hl>0) o+=circ(px,py,26,{stroke:GOLD,sw:4,op:hl});
  });
  o+=g(hl,`${rect(1150,250,640,64,{fill:"#2a2410",stroke:GOLD})}`+T(1470,283,"t = 3 points → unique curve",{size:28,fill:GOLD}));
  // alternatives through 2 points
  if(altP>0){
    [-0.35,0.3,0.62].forEach((kk,j)=>{ let d=""; for(let x=-0.05;x<=5.1;x+=0.05){const y=F(x)+kk*(x-1)*(x-4); const [px,py]=P(x,y); d+=(d?"L":"M")+px.toFixed(1)+","+py.toFixed(1);}
      o+=`<path d="${d}" fill="none" stroke="#9fb3ff" stroke-width="3" stroke-dasharray="10 8" opacity="${altP*.85}"/>`;
      const [qx,qy]=P(0,F(0)+4*kk); o+=g(altP,circ(qx,qy,10,{fill:"#9fb3ff"})+T(qx-34,qy,"?",{size:30,fill:"#9fb3ff",weight:"bold"}));
    });
    o+=g(altP,`${rect(1150,250,640,64,{fill:"#151d3a",stroke:"#9fb3ff"})}`+T(1470,283,"t − 1 = 2 points → any secret fits",{size:28,fill:"#9fb3ff"}));
  }
  // dealer
  const pd=ease(c.rv(3,.2)), px=ease(c.rv(3,2.6));
  o=g(1-0.7*pd,o);
  o+=g(pd,`${rect(1290,380,420,250,{fill:"#1f1830",stroke:"#c58bff",sw:3,rx:20})}`+
     `<circle cx="1500" cy="450" r="34" fill="#c58bff"/><path d="M1440,540 Q1500,470 1560,540 Z" fill="#c58bff"/>`+
     T(1500,585,"dealer knows f(0)",{size:28,fill:"#e5d2ff"})+cross(1500,505,3.2,RED,px)+
     g(px,T(1500,665,"DKG: no trusted dealer",{size:30,fill:"#ff9fb0",weight:"bold"})));
  return o;
});
// 3 everyone deals
S.push(c=>{
  let o="";
  const cx0=470, cw=200, cy0=270, rh=92;
  const X=j=>cx0+j*cw, Y=i=>cy0+i*rh;
  const pCol0=ease(c.rv(3,.3));
  // column headers
  for(let j=1;j<=5;j++) o+=g(ease(c.rv(1,0)),node(X(j),232,j-1,{r:30,fs:22})+T(X(j),282,"receives",{size:16,fill:DIM}));
  o+=g(pCol0,T(X(0),232,"x = 0",{size:26,fill:GOLD,serif:true,italic:true}));
  for(let i=0;i<5;i++){
    const p=ease(c.rv(0,.4+i*.3));
    o+=g(p,node(150,Y(i+1)-rh+92,i,{r:30,fs:22}));
    // mini curve
    let d=""; for(let x=0;x<=1.0001;x+=0.05){const yy=Math.sin((x*2.4+i*1.3))*12+ (i%2?-6:6)*x; d+=(d?"L":"M")+(205+x*130).toFixed(1)+","+(Y(i+1)-rh+92-yy).toFixed(1);}
    o+=g(p,`<path d="${d}" fill="none" stroke="${COL[i]}" stroke-width="4"/>`+T(270,Y(i+1)-rh+92+34,`f_${i+1}(x)`,{size:22,fill:COL[i],serif:true,italic:true}));
  }
  // cells
  for(let i=1;i<=5;i++) for(let j=1;j<=5;j++){
    const del=((i-1)*5+(j-1))*0.16+0.3, p=ease(c.rv(1,del,.5));
    const x=X(j), y=Y(i);
    o+=g(p, rect(x-80,y-32,160,64,{fill:i===j?COL[i-1]+"33":"#0f1730",stroke:COL[i-1],sw:2,rx:10})+T(x,y+1,`f_${i}(${j})`,{size:24,fill:COL[i-1],serif:true,italic:true}));
    if(i!==j && p>0 && p<1) {}
  }
  // flying packets during beat 1
  const tb=c.tb(1);
  if(tb>0 && tb<6){ for(let i=1;i<=5;i++) for(let j=1;j<=5;j++){ if(i===j)continue; const del=((i-1)*5+(j-1))*0.16+0.3; const pp=(tb-del+0.5)/0.5;
      o+=packet(180,Y(i),X(j),Y(i),clamp(pp,0,1)<1&&pp>0?ease(pp):-1,COL[i-1],7);} }
  // sums
  const pSum=ease(c.rv(2,.5));
  const ys=Y(5)+95;
  for(let j=1;j<=5;j++){
    const p=ease(c.rv(2,.5+(j-1)*.25));
    o+=g(p, rect(X(j)-90,Y(1)-44,180,Y(5)-Y(1)+88,{fill:"none",stroke:COL[j-1],sw:3,rx:16,op:.7}) + T(X(j),ys-28,"Σ",{size:30,fill:"#8fa3cc"}) + chip(X(j),ys+12,150,48,`sk_${j} = F(${j})`,COL[j-1],{size:22}));
  }
  o+=g(ease(c.rv(2,3.2)),`${rect(1310,950-55,0,0)}`);
  // column 0
  if(pCol0>0){
    for(let i=1;i<=5;i++){ const x=X(0), y=Y(i); o+=g(pCol0*(c.rv(3,.3+i*.15)), rect(x-80,y-32,160,64,{fill:"#211b0a",stroke:GOLD,sw:2,rx:10,dash:"8 6"})+T(x,y+1,`f_${i}(0)`,{size:24,fill:GOLD,serif:true,italic:true})); }
    const pS=ease(c.rv(3,1.6));
    o+=g(pS, rect(X(0)-90,Y(1)-44,180,Y(5)-Y(1)+88,{fill:"none",stroke:GOLD,sw:3,rx:16,dash:"10 8"})+ T(X(0),ys-28,"Σ",{size:30,fill:"#8fa3cc"}) + chip(X(0),ys+12,170,48,"F(0) = sk",GOLD,{size:22,dash:"8 6"}));
    const pN=ease(c.rv(3,3.2));
    o+=g(pN, T(X(0),ys+70,"never computed",{size:24,fill:"#ff9fb0",weight:"bold"}));
  }
  o+=g(pSum*(1-0.0),T(1700, 90, "F(x) = Σ_i f_i(x)",{size:34,serif:true,italic:true,fill:INK}));
  return o;
});
// 4 commitments
S.push(c=>{
  let o="";
  const y1=230;
  const p0=ease(c.rv(0,.3));
  o+=g(p0,node(170,y1,0,{r:34,fs:24})+T(170,y1+62,"node i",{size:20,fill:DIM}));
  const coef=["a_0","a_1","a_2"];
  coef.forEach((a,k)=>{const p=ease(c.rv(0,.6+k*.2)); o+=g(p,chip(330+k*130,y1,110,56,a,COL[0],{size:28,rx:10}));});
  o+=g(ease(c.rv(0,1.5)),T(460,y1-58,"secret coefficients of f_i",{size:22,fill:"#8fa3cc"}));
  o+=arrow(640,y1,830,y1,ease(c.rv(0,2.0,.8)),{stroke:GOLD});
  o+=g(ease(c.rv(0,2.2)),T(735,y1-32,"· G",{size:34,fill:GOLD,serif:true,italic:true}));
  coef.forEach((a,k)=>{const p=ease(c.rv(0,2.8+k*.2)); o+=g(p,chip(920+k*150,y1,130,56,`a_${k}·G`,GREEN,{size:26,rx:10}));});
  o+=g(ease(c.rv(0,3.6)),T(1070,y1-58,"public commitment C_i (curve points)",{size:22,fill:"#8fa3cc"}));
  o+=g(ease(c.rv(0,4.2)),T(1530,y1,"easy →, infeasible ←",{size:24,fill:"#8fa3cc",anchor:"start"}));
  // pk sum
  const y2=500;
  for(let i=0;i<5;i++){ const p=ease(c.rv(1,.3+i*.25));

function renderAt(Tg){
  const sc=TL.scenes; let si=sc.findIndex(s=>Tg>=s.start&&Tg<s.end); if(si<0) si=Tg<0?0:sc.length-1;
  const s=sc[si], B=s.beats;
  const ctx={T:Tg,
    rv:(k,delay=0,dur=.7)=>clamp((Tg-(B[k].start+delay))/dur),
    tb:k=>Tg-B[k].start, d:k=>B[k].dur, beatEnd:k=>B[k].start+B[k].dur};
  const env=Math.min(clamp((Tg-s.start)/0.5), clamp((s.end-Tg)/0.4));
  document.getElementById("svg").innerHTML=`<g opacity="${env}">${S[si](ctx)}</g>`;
  let bi=B.findIndex(b=>Tg>=b.start&&Tg<b.start+b.dur); if(bi<0) bi=B.length-1;
  const b=B[bi]; const cop=Math.min(clamp((Tg-b.speechStart+0.15)/0.25), clamp((b.speechEnd+0.35-Tg)/0.25));
  document.getElementById("cap").innerHTML=`<span style="opacity:${cop}">${b.caption}</span>`;
  document.getElementById("cap").style.opacity=cop;
  document.getElementById("hdr").innerHTML=si===0?"":`<b>${String(si).padStart(2,"0")}</b>${s.title}`;
  document.getElementById("hdr").style.opacity=env;
  document.getElementById("bar").style.width=(100*Tg/TL.total)+"%";
}
window.renderAt=renderAt;
