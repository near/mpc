[licenses]
clarify = [
  { name = "near-chain", expression = "MIT OR Apache-2.0", license-files = [
  ] },
  { name = "stringmetrics", expression = "Apache-2.0", license-files = [
    { path = "LICENSE", hash = 0xc9663a1e },
  ] },
]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "MPL-2.0",
  "Zlib",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "CDDL-1.0",
]

[advisories]
unsound = "all"
ignore = [
  "RUSTSEC-2022-0054", # wee_alloc is unmaintained
  "RUSTSEC-2024-0436", # paste is unmaintained
  "RUSTSEC-2024-0384", # instant is unmaintained
  "RUSTSEC-2023-0089", # atomic-polyfill is unmaintained
  # Pulled in by serde_yaml, which nearcore's near-parameters also depends on.
  "RUSTSEC-2024-0449", # unsafe-libyaml is unmaintained
  # TODO(#3732): remove once quick-xml dependency is >= 0.41.0
  "RUSTSEC-2026-0194", # quadratic attribute duplicate-check
  "RUSTSEC-2026-0195", # unbounded namespace-declaration allocation
  # Both need wasmtime >= 46.0.3; the 45.x line nearcore pins has no
  # patched release for either. Reachable only through near-vm-runner, which never
  # shares a Store across Engines and does not depend on `wasmtime-wasi`.
  "RUSTSEC-2026-0222", # wasmtime stores can mix up type indices between engines
  "RUSTSEC-2026-0269", # wasmtime-wasi filesystem sandbox escape via trailing slashes
  # Fixed in wasmtime >= 48.0.3, with no patched 45.x release. Affects only the component-model
  # `Val` API; no crate in the workspace enables wasmtime's `component-model` feature.
  "RUSTSEC-2026-0316", # wasmtime `Val` record lifting allocates beyond the fuel limit
  # Fixed in wasmtime >= 48.0.4, with no patched 45.x release. Affects only the component-model
  # async API; no crate in the workspace enables wasmtime's `component-model` feature.
  "RUSTSEC-2026-0327", # wasmtime component async-lifted callback result count unvalidated
  # Fixed in wasmtime >= 48.0.6, with no patched 45.x release. The workspace builds wasmtime
  # without its `gc`, `async` and `component-model` features, and near-vm-runner's preparation
  # step rejects the GC reference types a guest needs to build the type chain in 0359.
  "RUSTSEC-2026-0359", # wasmtime stack overflow dropping a long chain of recursive types
  "RUSTSEC-2026-0362", # wasmtime may not enforce the async-entrypoint requirement
  "RUSTSEC-2026-0363", # wasmtime component-model handle tables are charged to no limit
  # Fixed in wasmtime >= 48.0.7, with no patched 45.x release. Affects only the Cranelift
  # aarch64 backend; release and CI builds target x86_64, where the miscompiled lowering
  # is never emitted.
  "RUSTSEC-2026-0379", # wasmtime aarch64 jumps to incorrect target on large `br_table`
  # Fixed in wasmtime >= 48.0.8, with no patched 45.x release. Affects only component-model
  # `borrow<T>` tracking; no crate in the workspace enables wasmtime's `component-model` feature.
  "RUSTSEC-2026-0424", # wasmtime borrowed resources between components use unchecked memory
  # Fixed in wasmtime >= 48.0.9, with no patched 45.x release. 0566 and 0571 are in `wasmtime-wasi`
  # and `wasmtime-wasi-http`, which are not in the tree. near-vm-runner keeps wasmtime's default
  # `Config`, which leaves the threads proposal 0567 needs disabled. Preparation always exports the
  # memory and near-vm-runner resolves it right after instantiation, so host functions never reach
  # the `Caller::get_module_export` lookup that panics in 0569. The workspace builds wasmtime
  # without its `gc` feature, so there is no GC heap for 0573.
  "RUSTSEC-2026-0566", # wasmtime-wasi unbounded memory growth via empty `AsyncWriteStream` writes
  "RUSTSEC-2026-0567", # wasmtime aborts on wait/notify in builds without the `threads` feature
  "RUSTSEC-2026-0569", # wasmtime `Caller::get_module_export` panics when not called from Wasm
  "RUSTSEC-2026-0571", # wasmtime-wasi-http unbounded heap usage from empty HTTP/2 body writes
  "RUSTSEC-2026-0573", # wasmtime aborts when a GC heap reservation is not page-aligned
  # TODO(#4839): remove once cargo can resolve zip >= 9.0.5.
  # zip comes only from nearcore's near-rosetta-rpc via utoipa-swagger-ui, whose build script
  # never calls the vulnerable `extract` or `ZipStreamReader` APIs and builds zip without
  # `aes-crypto`: it reads a pinned Swagger UI release archive through `ZipArchive::by_index`
  # and writes its entries as plain files.
  "RUSTSEC-2026-0367", # zip extraction preserves SUID/SGID bits
  "RUSTSEC-2026-0368", # zip extraction creates symlinks pointing outside the destination
  "RUSTSEC-2026-0369", # zip extraction applies Unix permissions through symlinks
  "RUSTSEC-2026-0429", # zip extraction aborts on a symlink entry with a huge declared size
  "RUSTSEC-2026-0545", # zip AES entries skip the authentication code on early EOF or empty data
  "RUSTSEC-2026-0548", # zip `ZipStreamReader` trusts local-header names
  ## TEMPORARY, TODO(#4957): near-global-contracts 0.3 (via near-sdk 5.30 and near-kit 0.20) needs ##
  ## proc-macro-error3 >= 3.0.2, while alloy-sol-macro 1.7.3 (via dstack-sdk) caps it at 3.0.1, so
  ## cargo falls back to alloy-sol 1.6, which uses proc-macro-error2. A build time proc macro, no
  ## vulnerability.
  "RUSTSEC-2026-0173", # proc-macro-error2 is unmaintained
  ## End of the temporary entries
  # Fixed in lru >= 0.18.2, which our own dependency already uses; the older copy comes from
  # nearcore, through reed-solomon-erasure
  "RUSTSEC-2026-0253", # lru cache is not panic-safe when removing an entry
  # TODO(#4916): remove once elliptic-curve 0.13 and its crypto-bigint 0.5.5 leave the tree.
  # No patched 0.5.x exists, and the leaks are in 0.7 code: the `borrowing_sub` branch came
  # with crypto-bigint#1029, and k256 0.13 scalars use only 0.5.5's mask-based add/sub/neg
  # mod, with their own multiplication and inversion.
  "RUSTSEC-2026-0387", # crypto-bigint constant-time leaks
  # Pulled in by nix 0.26's default `aio` feature, which webrtc-util 0.10 enables for nearcore's
  # near-network through stun 0.7.
  "RUSTSEC-2026-0441", # pin-utils is unmaintained
  # No workspace crate uses chrono directly; nearcore, dcap-qvl, object_store and `built` (for
  # `BUILT_TIME_UTC`) pull it in.
  "RUSTSEC-2026-0543", # chrono is unmaintained
  # The advisory assumes humantime wraps chrono, but humantime has no dependencies. Used by
  # mpc-node and nearcore's object_store.
  "RUSTSEC-2026-0542", # humantime is unmaintained
  # heapless 0.7 comes only from postcard 1.1.3's default `heapless-cas` feature, which frost-core
  # 3.0.0 enables; no postcard release depends on heapless >= 0.9.4. postcard uses only
  # `heapless::Vec` and `heapless::String`, and never calls the flagged methods on them; frost-core
  # and wasmtime use postcard's `alloc` API. The other flagged types are unused.
  "RUSTSEC-2026-0574", # heapless `FindMutView::pop` use after free
  "RUSTSEC-2026-0575", # heapless `Spsc::peek` uses `Relaxed` ordering
  "RUSTSEC-2026-0576", # heapless `IndexMap::truncate` leaves stale indices
  "RUSTSEC-2026-0577", # heapless panicking `Drop` breaks invariants
  "RUSTSEC-2026-0578", # heapless `SortedLinkedList::zeroize` leaves an inconsistent list
  "RUSTSEC-2026-0579", # heapless `Deque::try_from` with a full array
  "RUSTSEC-2026-0580", # heapless treiber stack race
  "RUSTSEC-2026-0581", # heapless `Deque::make_contiguous` breaks invariants
  "RUSTSEC-2026-0582", # heapless `IndexMap::insert` on a map of `u16::MAX` entries
]

[bans]
multiple-versions = "allow"

[sources]
unknown-git = "deny"
allow-git = [
  "https://github.com/near/nearcore",
]
