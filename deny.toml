[licenses]
clarify = [
  { name = "near-chain", expression = "MIT OR Apache-2.0", license-files = [
  ] },
]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "MPL-2.0",
  "Zlib",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "CDDL-1.0",
]

[advisories]
unsound = "all"
ignore = [
  "RUSTSEC-2022-0054", # wee_alloc is unmaintained
  "RUSTSEC-2024-0436", # paste is unmaintained
  "RUSTSEC-2024-0384", # instant is unmaintained
  "RUSTSEC-2023-0089", # atomic-polyfill is unmaintained
  # TODO(#3732): remove once quick-xml dependency is >= 0.41.0
  "RUSTSEC-2026-0194", # quadratic attribute duplicate-check
  "RUSTSEC-2026-0195", # unbounded namespace-declaration allocation
  # Both need wasmtime >= 46.0.3; the 45.x line nearcore pins has no
  # patched release for either. Reachable only through near-vm-runner, which never
  # shares a Store across Engines and does not depend on `wasmtime-wasi`.
  "RUSTSEC-2026-0222", # wasmtime stores can mix up type indices between engines
  "RUSTSEC-2026-0269", # wasmtime-wasi filesystem sandbox escape via trailing slashes
  # Fixed in wasmtime >= 48.0.3, with no patched 45.x release. Affects only the component-model
  # `Val` API; no crate in the workspace enables wasmtime's `component-model` feature.
  "RUSTSEC-2026-0316", # wasmtime `Val` record lifting allocates beyond the fuel limit
  # Fixed in wasmtime >= 48.0.4, with no patched 45.x release. Affects only the component-model
  # async API; no crate in the workspace enables wasmtime's `component-model` feature.
  "RUSTSEC-2026-0327", # wasmtime component async-lifted callback result count unvalidated
  # TODO(#4423): remove once cargo can resolve rustls >= 0.23.45.
  # Fixed in rustls >= 0.23.45, which requires aws-lc-rs ^1.18; nearcore 2.14.0-rc.2 and
  # near-crypto 0.37.4 pin it to =1.16.2, so the fix cannot be resolved until they move. The
  # handshake transcript stays authenticated: the flaw only lets a peer send handshake
  # messages that should be encrypted in plaintext without rustls rejecting them.
  "RUSTSEC-2026-0285", # rustls accepts TLS 1.3 handshake messages across encryption levels
  # Fixed in lru >= 0.18.2, which our own dependency already uses; the older copies come from
  # nearcore, through reed-solomon-erasure, and from the VM behind near-sdk's unit tests
  "RUSTSEC-2026-0253", # lru cache is not panic-safe when removing an entry
]

[bans]
multiple-versions = "allow"

[sources]
unknown-git = "deny"
allow-git = [
  "https://github.com/near/nearcore",
]
