id: mod-declarations-contiguous
language: rust
severity: error
message: "module `$M` is declared apart from the other module declarations"
note: Keep the module declarations of a scope together. Blank lines between visibility groups are not a split.
# Attributes and comments count as part of a run, which keeps a lone
# `#[cfg(test)] mod tests;` legal at the foot of a file.
rule:
  all:
    - any:
        - pattern: mod $M;
        - pattern: pub mod $M;
    - not:
        follows:
          any:
            - pattern: mod $N;
            - pattern: pub mod $N;
            - kind: attribute_item
            - kind: line_comment
            - kind: block_comment
          stopBy: neighbor
    - follows:
        any:
          - pattern: mod $N;
          - pattern: pub mod $N;
        stopBy: end
