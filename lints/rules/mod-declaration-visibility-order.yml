id: mod-declaration-visibility-order
language: rust
severity: error
message: "`$VIS mod $M;` is declared directly after a module with narrower visibility"
note: Declare modules widest visibility first, `pub`, then `pub(crate)`, then private.
# Repeated per branch: in ast-grep 0.42 a `matches:` reference inside a relational
# rule matches nothing instead of erroring.
rule:
  any:
    - all:
        - pattern: pub mod $M;
        - has:
            kind: visibility_modifier
            pattern: $VIS
            regex: "^pub$"
            stopBy: neighbor
        - follows:
            all:
              - any:
                  - all:
                      - pattern: pub mod $N;
                      - has:
                          kind: visibility_modifier
                          regex: '^pub\('
                          stopBy: neighbor
                  - pattern: mod $N;
              # `#[macro_use]` must stay textually first.
              - not:
                  follows:
                    kind: attribute_item
                    regex: macro_use
                    stopBy: neighbor
            stopBy:
              not:
                any:
                  - kind: line_comment
                  - kind: block_comment
    - all:
        - pattern: pub mod $M;
        - has:
            kind: visibility_modifier
            pattern: $VIS
            regex: '^pub\('
            stopBy: neighbor
        - follows:
            all:
              - pattern: mod $N;
              - not:
                  follows:
                    kind: attribute_item
                    regex: macro_use
                    stopBy: neighbor
            stopBy:
              not:
                any:
                  - kind: line_comment
                  - kind: block_comment
