id: mod-declaration-visibility-order
language: rust
severity: error
message: "`$VIS mod $M;` is declared directly after a module with narrower visibility"
note: Order module declarations `pub`, then `pub(crate)`, then private, separated by blank lines.
# `pub mod $M;` matches every visibility. `pub(super)` shares the middle tier. Only the immediately preceding
# declaration is checked.
rule:
  any:
    - all:
        - pattern: pub mod $M;
        - has:
            kind: visibility_modifier
            pattern: $VIS
            regex: "^pub$"
            stopBy: neighbor
        - follows:
            any:
              - all:
                  - pattern: pub mod $N;
                  - has:
                      kind: visibility_modifier
                      regex: '^pub\('
                      stopBy: neighbor
              - all:
                  - pattern: mod $N;
                  # `#[macro_use]` modules are exempt: their macros are only in
                  # scope for the rest of the crate textually, so they have to
                  # stay first.
                  - not:
                      follows:
                        kind: attribute_item
                        regex: macro_use
                        stopBy: neighbor
            stopBy: neighbor
    # `pub(crate)` or `pub(super)` directly after a private declaration.
    - all:
        - pattern: pub mod $M;
        - has:
            kind: visibility_modifier
            pattern: $VIS
            regex: '^pub\('
            stopBy: neighbor
        - follows:
            all:
              - pattern: mod $N;
              - not:
                  follows:
                    kind: attribute_item
                    regex: macro_use
                    stopBy: neighbor
            stopBy: neighbor
